name: Buffet CRM image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"
      - name: Validate custom Ruby sources
        run: |
          ruby -c app/services/imports/lokagenda_importer.rb
          ruby -c lib/tasks/buffet_crm.rake
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
            RAILS_SERVE_STATIC_FILES=true
          tags: |
            ghcr.io/kauamenesesr7-ui/buffet-crm-backend:latest
            ghcr.io/kauamenesesr7-ui/buffet-crm-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
